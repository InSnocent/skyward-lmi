[package]
name = "skyward-backup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
lz4_flex = "0.14.0"
rustix = { version = "1.1.5", features = ["fs"] }
